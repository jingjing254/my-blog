<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440" role="img"><title>两个评分标签指向同一个 burst-once 事件</title><style>svg{background:#f6f8fb;color:#172839;font-family:system-ui,"PingFang SC","Microsoft YaHei",sans-serif}.ink{fill:#172839;color:#172839}.muted{fill:#586878;color:#586878}.raw{fill:#9d4d05;color:#9d4d05}.exact{fill:#136b91;color:#136b91}.event{fill:#7950a0;color:#7950a0}@media(prefers-color-scheme:dark){svg{background:#17232f}.ink{fill:#edf3fa;color:#edf3fa}.muted{fill:#b3c2d1;color:#b3c2d1}.raw{fill:#ffc184;color:#ffc184}.exact{fill:#80d4f5;color:#80d4f5}.event{fill:#d5b4fc;color:#d5b4fc}}</style><text x="28" y="40" font-size="28" class="ink" text-anchor="start">两个标签，同一次爆发</text><text x="28" y="100" font-size="25" class="event" text-anchor="start">形成组合  +2.4</text><text x="330" y="100" font-size="25" class="event" text-anchor="start">后续爆发  +2.4</text><path d="M135,120 L270,198" style="fill:none" class="event" stroke="currentColor" stroke-width="3" stroke-dasharray=""/><path d="M445,120 L330,198" style="fill:none" class="event" stroke="currentColor" stroke-width="3" stroke-dasharray="7 5"/><rect x="115" y="200" width="370" height="110" rx="12" fill="none" stroke="#7950a0" stroke-width="3"/><text x="300" y="243" font-size="26" class="event" text-anchor="middle">burst-once</text><text x="300" y="282" font-size="23" class="ink" text-anchor="middle">成功率 0.6 × 有效伤害 4</text><text x="28" y="365" font-size="25" class="ink" text-anchor="start">标签相加：4.8     事件结算一次：2.4</text><text x="28" y="410" font-size="23" class="muted" text-anchor="start">两个箭头是解释路径，不是两次伤害。</text></svg>
