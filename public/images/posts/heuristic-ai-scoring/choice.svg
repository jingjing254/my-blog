<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 435" role="img"><title>双发评分 1.2，真实期望 0.84；稳射真实期望 1</title><style>svg{background:#f6f8fb;color:#172839;font-family:system-ui,"PingFang SC","Microsoft YaHei",sans-serif}.ink{fill:#172839;color:#172839}.muted{fill:#586878;color:#586878}.raw{fill:#9d4d05;color:#9d4d05}.exact{fill:#136b91;color:#136b91}.event{fill:#7950a0;color:#7950a0}@media(prefers-color-scheme:dark){svg{background:#17232f}.ink{fill:#edf3fa;color:#edf3fa}.muted{fill:#b3c2d1;color:#b3c2d1}.raw{fill:#ffc184;color:#ffc184}.exact{fill:#80d4f5;color:#80d4f5}.event{fill:#d5b4fc;color:#d5b4fc}}</style><text x="28" y="40" font-size="28" class="ink" text-anchor="start">同一个一血靶，只剩一步</text><circle cx="300" cy="126" r="42" fill="none" stroke="#7950a0" stroke-width="4"/><text x="300" y="135" font-size="24" class="event" text-anchor="middle">1 HP</text><path d="M100,202 L265,151" style="fill:none" class="raw" stroke="currentColor" stroke-width="3" stroke-dasharray="6 5"/><path d="M500,202 L335,151" style="fill:none" class="exact" stroke="currentColor" stroke-width="3" stroke-dasharray=""/><text x="30" y="240" font-size="25" class="raw" text-anchor="start">双发：各 60%</text><text x="350" y="240" font-size="25" class="exact" text-anchor="start">稳射：必中</text><text x="30" y="298" font-size="25" class="raw" text-anchor="start">原始评分  1.2</text><text x="350" y="298" font-size="25" class="exact" text-anchor="start">原始评分  1</text><text x="30" y="344" font-size="25" class="ink" text-anchor="start">实际期望  0.84</text><text x="350" y="344" font-size="25" class="exact" text-anchor="start">实际期望  1</text><text x="28" y="405" font-size="22" class="muted" text-anchor="start">收益单位：实际扣血；两发独立，每发一伤</text></svg>
