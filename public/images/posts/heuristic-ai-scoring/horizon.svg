<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 525" role="img"><title>剩一步选直射，剩两步选蓄力；奖励为累计有效伤害</title><style>svg{background:#f6f8fb;color:#172839;font-family:system-ui,"PingFang SC","Microsoft YaHei",sans-serif}.ink{fill:#172839;color:#172839}.muted{fill:#586878;color:#586878}.raw{fill:#9d4d05;color:#9d4d05}.exact{fill:#136b91;color:#136b91}.event{fill:#7950a0;color:#7950a0}@media(prefers-color-scheme:dark){svg{background:#17232f}.ink{fill:#edf3fa;color:#edf3fa}.muted{fill:#b3c2d1;color:#b3c2d1}.raw{fill:#ffc184;color:#ffc184}.exact{fill:#80d4f5;color:#80d4f5}.event{fill:#d5b4fc;color:#d5b4fc}}</style><text x="28" y="40" font-size="27" class="ink" text-anchor="start">八血靶：同一个动作，不同的期限</text><text x="28" y="105" font-size="25" class="event" text-anchor="start">还剩 1 步</text><text x="28" y="154" font-size="25" class="exact" text-anchor="start">直射 → 结束     总伤害 2</text><text x="28" y="201" font-size="25" class="raw" text-anchor="start">蓄力 → 结束     总伤害 0</text><text x="28" y="285" font-size="25" class="event" text-anchor="start">还剩 2 步</text><text x="28" y="334" font-size="25" class="exact" text-anchor="start">直射 → 直射     总伤害 4</text><text x="28" y="381" font-size="25" class="raw" text-anchor="start">蓄力 → 爆发     总伤害 5</text><text x="28" y="455" font-size="24" class="ink" text-anchor="start">一步：2 对 0；两步：4 对 5。</text><text x="28" y="495" font-size="21" class="muted" text-anchor="start">蓄力当步零伤；未使用的蓄力没有终局奖励。</text></svg>
